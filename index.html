<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小安 · 保险规划助手</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workflow.css"></head><body><main class="flow">
<header><span>小安 · 保险保障教育与辅助规划</span><h1>让每一份保障，都有清楚的依据。</h1><p class="notice">仅开发 / 受控演示 · 中国大陆 · 非保险销售、正式核保或理赔裁定。暂无在线人工接管人员。</p></header><div id="error" role="alert" aria-live="polite"></div>
<section id="entry"><h2>从规划对象开始</h2><label>规划模式 <select id="mode"><option value="individual">个人规划（一名被保险人，可为孩子）</option><option value="family">家庭规划（至少两人）</option></select></label><label>任务 <select id="intent"><option value="plan">保障规划</option><option value="explain">知识解释</option><option value="compare">条款比较</option></select></label><p>请勿提交姓名、证件号、手机号或完整病历。必要信息经服务器处理并加密保存，会话有效期24小时。浏览器 sessionStorage 保存访问凭据。启用模型并单独授权后，必要的脱敏问题可能发送至模型提供方；未成年人及健康资料不外发。可随时删除会话。</p><label><input id="privacyAccept" type="checkbox"> 我已阅读并接受隐私说明 v1</label><button id="start" class="primary-button">开始咨询</button></section>
<div id="consult" hidden><p id="status"></p><div class="grid"><div><section><h2>规划对话</h2><p id="next"></p><label>保障对象关系 <select id="relation"><option value="self">本人</option><option value="child">孩子</option><option value="spouse">配偶</option><option value="parent">父母</option><option value="other">其他</option></select></label><button id="addMember" class="secondary-button">添加保障对象</button><button id="switchMode" class="secondary-button">切换个人 / 家庭</button><div id="fieldForm"><label>当前字段回答 <input id="answerValue"></label><button id="answer-known" class="primary-button">确认回答</button><button id="answer-none" class="secondary-button">明确没有</button><button id="answer-unknown" class="secondary-button">未知 / 跳过</button></div><label>自由输入（例如：给8岁的孩子规划，预算3000元/年）<textarea id="message"></textarea></label><button id="send" class="primary-button">发送</button><p id="reply" aria-live="polite"></p><div id="candidates"></div></section>
<section><h2>分析与报告</h2><button id="preliminary" class="secondary-button">生成初步建议</button><button id="detailed" class="primary-button">生成详细情景</button><p>详细分析需要已确认画像及审核证据。预算信封不代表实际保费报价。</p><label>文字版合同 PDF（5MiB以内，不支持扫描件）<input id="upload" type="file" accept="application/pdf"></label><div id="reportPanel" hidden><div id="reportReadable"></div><details><summary>查看结构化报告数据</summary><pre id="report"></pre></details><button id="export-json" class="secondary-button">导出 JSON</button><button id="export-txt" class="secondary-button">导出 TXT</button></div></section></div>
<aside><h2>已确认信息</h2><div id="profile"></div><h2>待补充</h2><p id="missing"></p><h2>存在冲突</h2><div id="conflicts"></div><h2>会话与授权</h2><label><input id="external" type="checkbox"> 同意必要脱敏问题发送至配置的模型提供方（可撤回）</label><label><input id="handoffConsent" type="checkbox"> 同意共享最小摘要用于待人工核验</label><button id="handoff" class="secondary-button">申请人工核验</button><button id="pause" class="secondary-button">暂停</button><button id="resume" class="secondary-button">恢复 / 继续补充</button><button id="complete" class="secondary-button">保存并完成</button><button id="user_end" class="secondary-button">结束咨询</button><button id="delete" class="secondary-button">删除本次全部数据</button></aside></div></div>
</main><script src="workflow.js"></script></body></html>
